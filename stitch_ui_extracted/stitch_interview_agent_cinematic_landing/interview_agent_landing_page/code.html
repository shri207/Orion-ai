<!-- STITCH_SHADER_START:ANIMATION_5 class="absolute inset-0 w-full h-full -z-20" -->
<div class="absolute inset-0 w-full h-full -z-20" style="display:block;">
<canvas id="shader-canvas-ANIMATION_5" style="display:block;width:100%;height:100%" width="1363" height="1359"></canvas>
<script>
(function() {
  const canvas = document.getElementById('shader-canvas-ANIMATION_5');

  // Sync the WebGL drawing-buffer size with the CSS-driven layout size.
  // This fires on initial layout and whenever the element is resized.
  function syncSize() {
    const w = canvas.clientWidth  || 1280;
    const h = canvas.clientHeight || 720;
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width  = w;
      canvas.height = h;
    }
  }
  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(syncSize).observe(canvas);
  }
  syncSize();

  const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
  if (!gl) return;
  const vs = `attribute vec2 a_position;
varying vec2 v_texCoord;
void main() {
  v_texCoord = a_position * 0.5 + 0.5;
  gl_Position = vec4(a_position, 0.0, 1.0);
}`;
  const fs = `precision highp float;
uniform float u_time;
uniform vec2 u_resolution;

void main() {
    vec2 uv = gl_FragCoord.xy / u_resolution.xy;
    
    // Deep emerald background
    vec3 color = vec3(0.027, 0.082, 0.078); 
    
    // Soft flowing gradients
    float pulse = sin(u_time * 0.2) * 0.5 + 0.5;
    float dist = distance(uv, vec2(0.5, 0.7));
    color += vec3(0.129, 0.961, 0.831) * (1.0 - smoothstep(0.0, 0.8, dist)) * 0.15 * pulse;
    
    // Secondary light streak
    float streak = sin(uv.x * 2.0 + uv.y * 1.5 + u_time * 0.5) * 0.5 + 0.5;
    color += vec3(0.3, 0.94, 0.83) * streak * 0.05;
    
    // Subtle film grain
    float noise = fract(sin(dot(uv, vec2(12.9898, 78.233) + u_time)) * 43758.5453);
    color += noise * 0.02;

    gl_FragColor = vec4(color, 1.0);
}`;
  function cs(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, cs(gl.VERTEX_SHADER, vs));
  gl.attachShader(prog, cs(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog);
  gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const pos = gl.getAttribLocation(prog, 'a_position');
  gl.enableVertexAttribArray(pos);
  gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);
  const uTime = gl.getUniformLocation(prog, 'u_time');
  const uRes = gl.getUniformLocation(prog, 'u_resolution');
  const uMouse = gl.getUniformLocation(prog, 'u_mouse');

  // u_mouse is in pixel coordinates matching u_resolution (ShaderToy convention).
  // Shaders that need normalized coords should use: u_mouse / u_resolution.
  let mouse = { x: canvas.width / 2, y: canvas.height / 2 };
  window.addEventListener('mousemove', (event) => {
    const rect = canvas.getBoundingClientRect();
    if (rect.width && rect.height) {
      const nx = (event.clientX - rect.left) / rect.width;
      const ny = 1.0 - (event.clientY - rect.top) / rect.height;
      mouse.x = nx * canvas.width;
      mouse.y = ny * canvas.height;
    }
  });

  function render(t) {
    if (typeof ResizeObserver === 'undefined') syncSize();
    gl.viewport(0, 0, canvas.width, canvas.height);
    if (uTime) gl.uniform1f(uTime, t * 0.001);
    if (uRes) gl.uniform2f(uRes, canvas.width, canvas.height);
    if (uMouse) gl.uniform2f(uMouse, mouse.x, mouse.y);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(render);
  }
  render(0);
})();
</script>

<div class="absolute inset-0 w-full h-full -z-10 opacity-70" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_4" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_4');
  const devicePixelRatio = window.devicePixelRatio || 1;
  const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
container.appendChild(renderer.domElement);

const group = new THREE.Group();
scene.add(group);

const topics = ["Prompt Engineering", "RAG", "Vector DB", "MCP", "Deployment"];
const cards = [];

const geometry = new THREE.PlaneGeometry(3, 4);
const materialBase = {
    transparent: true,
    opacity: 0.15,
    side: THREE.DoubleSide
};

topics.forEach((text, i) => {
    const material = new THREE.MeshPhongMaterial({
        ...materialBase,
        color: 0x21F5D4,
        shininess: 100,
        specular: 0x21F5D4
    });
    const card = new THREE.Mesh(geometry, material);
    
    const angle = (i / topics.length) * Math.PI * 2;
    const radius = 10;
    card.position.set(Math.cos(angle) * radius, Math.sin(angle) * 2, Math.sin(angle) * radius);
    card.lookAt(0, 0, 0);
    
    group.add(card);
    cards.push(card);
});

const light = new THREE.PointLight(0x21F5D4, 2, 50);
light.position.set(0, 5, 5);
scene.add(light);
scene.add(new THREE.AmbientLight(0x404040));

camera.position.z = 20;

function animate() {
    requestAnimationFrame(animate);
    group.rotation.y += 0.002;
    cards.forEach((card, i) => {
        card.rotation.x = Math.sin(Date.now() * 0.001 + i) * 0.1;
    });
    renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
    const width = container.clientWidth || window.innerWidth;
    const height = container.clientHeight || window.innerHeight;
    camera.aspect = width / height;
    camera.updateProjectionMatrix();
    renderer.setSize(width, height);
});

animate();
})();
</script>

        document.addEventListener('DOMContentLoaded', () => {
