<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width,initial-scale=1.0" name="viewport">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_4 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_4" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_4');
  const devicePixelRatio = window.devicePixelRatio || 1;
  const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
container.appendChild(renderer.domElement);

const group = new THREE.Group();
scene.add(group);

const topics = ["Prompt Engineering", "RAG", "Vector DB", "MCP", "Deployment"];
const cards = [];

const geometry = new THREE.PlaneGeometry(3, 4);
const materialBase = {
    transparent: true,
    opacity: 0.15,
    side: THREE.DoubleSide
};

topics.forEach((text, i) => {
    const material = new THREE.MeshPhongMaterial({
        ...materialBase,
        color: 0x21F5D4,
        shininess: 100,
        specular: 0x21F5D4
    });
    const card = new THREE.Mesh(geometry, material);
    
    const angle = (i / topics.length) * Math.PI * 2;
    const radius = 10;
    card.position.set(Math.cos(angle) * radius, Math.sin(angle) * 2, Math.sin(angle) * radius);
    card.lookAt(0, 0, 0);
    
    group.add(card);
    cards.push(card);
});

const light = new THREE.PointLight(0x21F5D4, 2, 50);
light.position.set(0, 5, 5);
scene.add(light);
scene.add(new THREE.AmbientLight(0x404040));

camera.position.z = 20;

function animate() {
    requestAnimationFrame(animate);
    group.rotation.y += 0.002;
    cards.forEach((card, i) => {
        card.rotation.x = Math.sin(Date.now() * 0.001 + i) * 0.1;
    });
    renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
    const width = container.clientWidth || window.innerWidth;
    const height = container.clientHeight || window.innerHeight;
    camera.aspect = width / height;
    camera.updateProjectionMatrix();
    renderer.setSize(width, height);
});

animate();
})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_4 -->


</body></html>
